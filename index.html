<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>MedRPG · Grimório Clínico</title>
  <meta name="description" content="Transforme suas horas de estudo de medicina em batalhas contra o Esquecimento.">
  <meta name="theme-color" content="#07080d">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Inter:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="fx-bg" aria-hidden="true"></canvas>

  <div class="app" id="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark" id="brand-mark"></span>
        <div>
          <div class="brand-name">MedRPG</div>
          <div class="brand-sub">Grimório Clínico</div>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot" id="sidebar-foot"></div>
    </aside>

    <main class="main">
      <header class="hud" id="hud"></header>
      <section class="view" id="view" tabindex="-1"></section>
    </main>
  </div>

  <!-- Tela de batalha (foco) -->
  <div class="focus" id="focus" aria-hidden="true"></div>

  <!-- Camadas globais -->
  <div class="modal-root" id="modal-root"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <canvas id="fx-top" aria-hidden="true"></canvas>

  <noscript><p style="padding:2rem;color:#fff">O MedRPG precisa de JavaScript para funcionar.</p></noscript>

  <script src="js/icons.js"></script>
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/views/battle.js"></script>
  <script src="js/views/focus.js"></script>
  <script src="js/views/results.js"></script>
  <script src="js/views/hero.js"></script>
  <script src="js/views/arsenal.js"></script>
  <script src="js/views/collection.js"></script>
  <script src="js/views/chronicle.js"></script>
  <script src="js/views/stats.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/dev.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
